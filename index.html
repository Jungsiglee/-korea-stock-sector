function getLeader(sector){
  return sector.stocks.find(s => s.leader) || sector.stocks.sort((a,b)=>b.cap-a.cap)[0];
}

function render(){
  const list = document.getElementById("app");

  const q = document.getElementById("search").value.toLowerCase();
  const sort = document.getElementById("sort").value;

  let data = sectors.filter(s =>
    s.name.toLowerCase().includes(q) ||
    s.desc.toLowerCase().includes(q) ||
    s.stocks.some(st => st.name.toLowerCase().includes(q))
  );

  if(sort === "score") data.sort((a,b)=>b.score-a.score);
  if(sort === "marketcap") data.sort((a,b)=>b.marketcap-a.marketcap);

  document.getElementById("sectorCount").textContent = data.length;
  document.getElementById("stockCount").textContent =
    data.reduce((sum,s)=>sum+s.stocks.length,0);
  document.getElementById("leaderCount").textContent =
    data.filter(s=>s.stocks.some(st=>st.leader)).length;

  list.innerHTML = data.map((s,i)=>`
    <article class="card ${i === 0 ? "hot" : ""}">
      <div class="rank">#${i+1} · 섹터점수 ${s.score}</div>
      <h2>${s.name}</h2>
      <p>${s.desc}</p>

                : ""

async function updateRealtimePrices(){

  const allStocks = sectors.flatMap(s => s.stocks);

  const symbols = allStocks
    .map(s => s.code)
    .filter(Boolean)
    .join(",");

  try {

    const res = await fetch(
      `https://query1.finance.yahoo.com/v7/finance/quote?symbols=${symbols}`
    );

    const json = await res.json();

    const quotes = json.quoteResponse.result;

    allStocks.forEach(stock => {

      const q = quotes.find(v => v.symbol === stock.code);

      if(q){

        stock.price = q.regularMarketPrice || 0;

        stock.change =
          q.regularMarketChangePercent?.toFixed(2) || 0;

        stock.marketCap =
          q.marketCap || stock.cap * 1000000000000;
      }

    });

    sectors.forEach(sector => {

      const avg =
        sector.stocks.reduce(
          (sum,s)=>sum + Number(s.change || 0),
          0
        ) / sector.stocks.length;

      sector.score = Math.round(80 + avg);

    });

    sectors.sort((a,b)=>b.score-a.score);

    render();

  } catch(e){

    console.log(e);

  }

}
