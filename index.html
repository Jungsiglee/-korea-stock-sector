<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>한국 증시 섹터맵</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="섹터맵">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#2563eb">

  <style>
    *{box-sizing:border-box}

    body{
      margin:0;
      padding:24px;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:#f4f6fb;
      color:#111827;
    }

    body.dark{
      background:#0f172a;
      color:#e5e7eb;
    }

    h1{
      margin:0;
      font-size:38px;
      font-weight:900;
    }

    .subtitle{
      margin-top:8px;
      font-size:17px;
      color:#6b7280;
      font-weight:700;
    }

    .top-actions{
      display:grid;
      grid-template-columns:1fr 120px 90px;
      gap:10px;
      margin:24px 0;
    }

    input,select,button{
      width:100%;
      border:1px solid #e5e7eb;
      outline:none;
      background:white;
      border-radius:18px;
      padding:16px;
      font-size:15px;
      font-weight:800;
      box-shadow:0 4px 14px rgba(0,0,0,.04);
    }

    button{
      background:#2563eb;
      color:white;
      border:none;
    }

    body.dark input,
    body.dark select,
    body.dark .summary-card,
    body.dark .sector-card,
    body.dark .rank-box,
    body.dark .sector-title,
    body.dark .sector-desc,
    body.dark .chip-box,
    body.dark .market-cap{
      background:#1e293b;
      color:#e5e7eb;
      border-color:#334155;
    }

    .summary-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:12px;
      margin-bottom:24px;
    }

    .summary-card{
      background:white;
      border-radius:22px;
      padding:18px 8px;
      text-align:center;
      border:1px solid #e5e7eb;
    }

    .summary-label{
      font-size:14px;
      font-weight:900;
    }

    .summary-number{

      font-size:34px;
      color:#2563eb;
      font-weight:900;
    }

    .sector-card{
      background:white;
      border-radius:26px;
      padding:18px;
      margin-bottom:22px;
      border:1px solid #e5e7eb;
      box-shadow:0 8px 24px rgba(0,0,0,.06);
    }

    .rank-box{
      background:#f8fafc;
      border:1px solid #e5e7eb;
      border-radius:18px;
      padding:14px;
      font-size:15px;
      font-weight:900;
      color:#2563eb;
      margin-bottom:14px;
    }

    .sector-title{
      border:1px solid #e5e7eb;
      border-radius:18px;
      padding:18px;
      font-size:25px;
      font-weight:900;
      margin-bottom:14px;
      background:white;
    }

    .sector-desc{
      background:#f8fafc;
      border:1px solid #e5e7eb;
      border-radius:18px;
      padding:15px;
      font-size:14px;
      line-height:1.55;
      font-weight:800;
      color:#6b7280;
      margin-bottom:14px;
    }

    .leader-box{
      background:#eef4ff;
      border-radius:18px;
      padding:16px;
      font-size:16px;
      font-weight:900;
      margin-bottom:14px;
      color:#111827;
    }

    body.dark .leader-box,
    body.dark .ai-box{
      background:#172554;
      color:#e5e7eb;
    }

    .chip-box{
      border:1px solid #e5e7eb;
      border-radius:18px;
      padding:14px;
      margin-bottom:14px;
    }

    .stock-chip{
      display:inline-block;
      background:#eef2ff;
      border-radius:999px;
      padding:10px 13px;
      margin:5px;
      font-size:13px;
      font-weight:900;
      color:#111827;
      cursor:pointer;
    }

    .stock-chip.up{color:#dc2626}
    .stock-chip.down{color:#2563eb}

    .market-cap{
      background:#f8fafc;
      border:1px solid #e5e7eb;
      border-radius:18px;
      padding:14px;
      font-size:14px;
      font-weight:900;
      color:#6b7280;
      margin-bottom:14px;
    }

    .ai-box{
      background:#eef4ff;
      border-left:6px solid #2563eb;
      border-radius:18px;
      padding:16px;
      font-size:14px;
      line-height:1.55;
      font-weight:800;
    }

    .chart-modal{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.55);
      z-index:999;
      padding:20px;
    }

    .chart-box{
      background:white;
      border-radius:22px;
      padding:16px;
      height:80vh;
    }

    body.dark .chart-box{
      background:#0f172a;
    }

    .chart-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-weight:900;
      margin-bottom:12px;
    }

    iframe{
      width:100%;
      height:90%;
      border:none;
      border-radius:16px;
    }
  </style>

<body>

    </div>

    </div>
    <div class="summary-card">

      <div class="summary-number" id="leaderCount">8</div>

  </div>

  <div id="sectorList"></div>

  <div class="chart-modal" id="chartModal">

        <span id="chartTitle">차트</span>
        <button style="width:80px" onclick="closeChart()">닫기</button>
      </div>

const sectorList = document.getElementById("sectorList");
const searchInput = document.getElementById("searchInput");
const sortSelect = document.getElementById("sortSelect");

async function getQuote(stock){
  try{
    const url = "https://api.allorigins.win/raw?url=" + encodeURIComponent(
      `https://query1.finance.yahoo.com/v8/finance/chart/${stock.code}?interval=1d&range=1d`
    );
    const res = await fetch(url);
    const data = await res.json();
    const r = data.chart.result[0];
    const meta = r.meta;
    const price = Math.round(meta.regularMarketPrice || 0);
    const prev = meta.previousClose || price;
    const change = ((price - prev) / prev * 100);
    stock.price = price;
    stock.change = change;
  }catch(e){
    stock.price = stock.price || 0;
    stock.change = stock.change ?? 0;
  }
}

function autoLeader(sector){
  const sorted = [...sector.stocks].sort((a,b)=>{
    const aa = (a.cap || 0) + ((a.change || 0) * 2);
    const bb = (b.cap || 0) + ((b.change || 0) * 2);
    return bb - aa;
  });
  return sorted[0];
}

function sectorChange(sector){
  const total = sector.stocks.reduce((sum,s)=>sum+(s.change||0),0);
  return total / sector.stocks.length;
}

function renderSectors(){
  const keyword = searchInput.value.toLowerCase();
  const sortType = sortSelect.value;

  let filtered = sectors.filter(sector =>
    sector.name.toLowerCase().includes(keyword) ||
    sector.stocks.some(s => s.name.toLowerCase().includes(keyword))
  );

  filtered.sort((a,b)=>{
    if(sortType === "cap") return b.cap - a.cap;
    if(sortType === "change") return sectorChange(b) - sectorChange(a);
    return b.score - a.score;
  });

  sectorList.innerHTML = filtered.map((sector,index)=>{
    const leader = autoLeader(sector);

    return `
      <div class="sector-card">
        <div class="rank-box">
          #${index+1} · 섹터점수 ${sector.score} · 평균등락 ${sectorChange(sector).toFixed(2)}%
        </div>

        <div class="sector-title">${sector.name}</div>
        <div class="sector-desc">${sector.desc}</div>

        <div class="leader-box">자동 대장주 · ${leader.name}</div>

        <div class="chip-box">
          ${sector.stocks.map(stock=>{
            const cls = (stock.change||0) >= 0 ? "up" : "down";
            const price = stock.price ? stock.price.toLocaleString()+"원" : "로딩중";
            const change = stock.change ? stock.change.toFixed(2)+"%" : "0.00%";
            const star = stock.name === leader.name ? " ★" : "";
            return `
              <span class="stock-chip ${cls}" onclick="openChart('${stock.name}','${stock.tv}')">
                ${stock.name}${star}<br>${price} / ${change}
              </span>
            `;
          }).join("")}
        </div>

        <div class="market-cap">추정 섹터 시총: ${sector.cap}조원</div>
        <div class="ai-box">${sector.ai}</div>
      </div>
    `;
  }).join("");
}

async function loadPrices(){
  renderSectors();

  for(const sector of sectors){
    for(const stock of sector.stocks){
      await getQuote(stock);
    }
  }

  renderSectors();
}

function openChart(name, symbol){
  document.getElementById("chartTitle").innerText = name + " 차트";
  document.getElementById("chartFrame").src =
    "https://s.tradingview.com/widgetembed/?symbol=" + symbol +
    "&interval=D&theme=light&style=1&locale=kr";
  document.getElementById("chartModal").style.display = "block";
}

function closeChart(){
  document.getElementById("chartModal").style.display = "none";
  document.getElementById("chartFrame").src = "";
}

function toggleDark(){
  document.body.classList.toggle("dark");
  localStorage.setItem("darkMode", document.body.classList.contains("dark"));
}

if(localStorage.getItem("darkMode") === "true"){
  document.body.classList.add("dark");
}

searchInput.addEventListener("input", renderSectors);
sortSelect.addEventListener("change", renderSectors);

loadPrices();
setInterval(loadPrices, 60000);
</script>

</html>
