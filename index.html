<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>한국 증시 섹터맵</title>
  <meta name="theme-color" content="#0f172a" />
  <style>
    :root {
      --bg:#f4f6f8; --card:#ffffff; --text:#111827; --sub:#6b7280;
      --accent:#2563eb; --border:#e5e7eb; --chip:#eef2ff;
    }
    body.dark {
      --bg:#0f172a; --card:#1e293b; --text:#f8fafc; --sub:#94a3b8;
      --accent:#60a5fa; --border:#334155; --chip:#172554;
    }
    * { box-sizing:border-box; }
    body {
      margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:var(--bg); color:var(--text);
    }
    header {
      position:sticky; top:0; z-index:10; background:var(--bg);
      padding:18px 16px 12px; border-bottom:1px solid var(--border);
    }
    h1 { margin:0 0 8px; font-size:24px; }
    .top { display:flex; gap:8px; align-items:center; }
    input, select, button {
      border:1px solid var(--border); border-radius:12px; padding:11px;
      background:var(--card); color:var(--text); font-size:15px;
    }
    input { flex:1; }
    button { cursor:pointer; }
    main { padding:16px; max-width:980px; margin:auto; }
    .summary {
      display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px;
    }
    .box {
      background:var(--card); border:1px solid var(--border); border-radius:16px;
      padding:14px; text-align:center;
    }
    .box b { display:block; font-size:20px; margin-top:4px; color:var(--accent); }
    .grid {
      display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:14px;
    }
    .card {
      background:var(--card); border:1px solid var(--border); border-radius:20px;
      padding:16px; box-shadow:0 4px 14px rgba(0,0,0,.05);
    }
    .rank { color:var(--accent); font-weight:700; }
    .title { font-size:20px; font-weight:800; margin:6px 0; }
    .desc { color:var(--sub); font-size:14px; line-height:1.45; }
    .leader {
      margin:12px 0; padding:10px; border-radius:14px; background:var(--chip);
      font-weight:700;
    }
    .stocks { display:flex; flex-wrap:wrap; gap:7px; margin-top:10px; }
    .chip {
      background:var(--chip); color:var(--text); border-radius:999px;
      padding:7px 10px; font-size:13px;
    }
    .meta { margin-top:10px; color:var(--sub); font-size:13px; }
    .ai {
      margin-top:10px; padding:10px; border-left:4px solid var(--accent);
      background:rgba(37,99,235,.08); font-size:13px; line-height:1.45;
    }
    @media(max-width:600px){
      .summary { grid-template-columns:1fr 1fr 1fr; }
      h1 { font-size:22px; }
      select { max-width:120px; }
    }
  </style>
</head>
<body>
<header>
  <h1>한국 증시 섹터맵</h1>
  <div class="top">
    <input id="search" placeholder="종목명 또는 섹터 검색" />
    <select id="sort">
      <option value="marketCap">시총순</option>
      <option value="score">섹터점수순</option>
      <option value="name">이름순</option>
    </select>
    <button onclick="toggleDark()">🌙</button>
  </div>
</header>

<main>
  <section class="summary">
    <div class="box">섹터<b id="sectorCount">0</b></div>
    <div class="box">종목<b id="stockCount">0</b></div>
    <div class="box">대장주<b id="leaderCount">0</b></div>
  </section>

  <section id="app" class="grid"></section>
</main>

<script>
const sectors = [
  {
    name:"반도체",
    score:98,
    marketCap:870,
    desc:"AI, HBM, 메모리, 파운드리, 장비·소재 중심 핵심 섹터",
    stocks:[
      {name:"삼성전자", cap:450, leader:true},
      {name:"SK하이닉스", cap:190},
      {name:"한미반도체", cap:18},
      {name:"리노공업", cap:4},
      {name:"솔브레인", cap:3}
    ],
    ai:"AI 서버 수요와 HBM 사이클이 핵심 변수입니다. 대형주는 실적 민감도, 소부장은 밸류체인 확장성이 중요합니다."
  },
  {
    name:"방산",
    score:94,
    marketCap:95,
    desc:"수출, 지정학 리스크, 장기 수주 모멘텀 중심",
    stocks:[
      {name:"한화에어로스페이스", cap:20, leader:true},
      {name:"현대로템", cap:8},
      {name:"LIG넥스원", cap:5},
      {name:"한국항공우주", cap:5},
      {name:"한화시스템", cap:4}
    ],
    ai:"수출 계약과 인도 일정이 주가 핵심입니다. 단기 테마보다 수주잔고와 마진 개선을 봐야 합니다."
  },
  {
    name:"조선",
    score:91,
    marketCap:120,
    desc:"LNG선, 친환경 선박, 해양플랜트, 수주잔고 중심",
    stocks:[
      {name:"HD현대중공업", cap:18, leader:true},
      {name:"한화오션", cap:11},
      {name:"삼성중공업", cap:9},
      {name:"HD한국조선해양", cap:12},
      {name:"HD현대미포", cap:4}
    ],
    ai:"고선가 수주분의 매출 인식과 후판가 안정 여부가 핵심입니다."
  },
  {
    name:"바이오",
    score:88,
    marketCap:210,
    desc:"CDMO, 신약, 바이오시밀러, 플랫폼 기술 중심",
    stocks:[
      {name:"삼성바이오로직스", cap:60, leader:true},
      {name:"셀트리온", cap:40},
      {name:"알테오젠", cap:15},
      {name:"유한양행", cap:8},
      {name:"리가켐바이오", cap:5}
    ],
    ai:"임상 결과, 기술수출, FDA 승인 이벤트가 강한 변동성을 만듭니다."
  },
  {
    name:"2차전지",
    score:84,
    marketCap:260,
    desc:"셀, 양극재, 음극재, 전해액, 장비 밸류체인",
    stocks:[
      {name:"LG에너지솔루션", cap:90, leader:true},
      {name:"삼성SDI", cap:40},
      {name:"에코프로비엠", cap:18},
      {name:"포스코퓨처엠", cap:20},
      {name:"엘앤에프", cap:5}
    ],
    ai:"전기차 수요 회복, 리튬 가격, 미국 정책 변화가 핵심 변수입니다."
  },
  {
    name:"전력기기",
    score:90,
    marketCap:80,
    desc:"AI 데이터센터, 전력망, 변압기, 송배전 투자 수혜",
    stocks:[
      {name:"HD현대일렉트릭", cap:12, leader:true},
      {name:"LS ELECTRIC", cap:8},
      {name:"효성중공업", cap:4},
      {name:"일진전기", cap:2}
    ],
    ai:"북미 전력망 투자와 데이터센터 전력 수요 증가가 구조적 모멘텀입니다."
  },
  {
    name:"자동차",
    score:82,
    marketCap:230,
    desc:"완성차, 부품, 전장, 하이브리드, 전기차",
    stocks:[
      {name:"현대차", cap:50, leader:true},
      {name:"기아", cap:45},
      {name:"현대모비스", cap:20},
      {name:"HL만도", cap:2}
    ],
    ai:"환율, 미국 판매, 하이브리드 믹스, 주주환원이 주요 포인트입니다."
  },
  {
    name:"인터넷/플랫폼",
    score:76,
    marketCap:120,
    desc:"검색, 커머스, 콘텐츠, 광고, AI 서비스",
    stocks:[
      {name:"NAVER", cap:35, leader:true},
      {name:"카카오", cap:20},
      {name:"카페24", cap:2}
    ],
    ai:"광고 경기와 AI 서비스 수익화 여부가 핵심입니다."
  }
];

function getLeader(sector){
  return sector.stocks.find(s => s.leader) || sector.stocks.sort((a,b)=>b.cap-a.cap)[0];
}

function render(){
  const q = document.getElementById("search").value.toLowerCase();
  const sort = document.getElementById("sort").value;

  let data = sectors.filter(sec =>
    sec.name.toLowerCase().includes(q) ||
    sec.stocks.some(s => s.name.toLowerCase().includes(q))
  );

  data.sort((a,b)=>{
    if(sort==="marketCap") return b.marketCap - a.marketCap;
    if(sort==="score") return b.score - a.score;
    return a.name.localeCompare(b.name);
  });

  document.getElementById("sectorCount").textContent = data.length;
  document.getElementById("stockCount").textContent = data.reduce((sum,s)=>sum+s.stocks.length,0);
  document.getElementById("leaderCount").textContent = data.length;

  document.getElementById("app").innerHTML = data.map((sec,i)=>{
    const leader = getLeader(sec);
    return `
      <article class="card">
        <div class="rank">#${i+1} · 섹터점수 ${sec.score}</div>
        <div class="title">${sec.name}</div>
        <div class="desc">${sec.desc}</div>
        <div class="leader">대장주: ${leader.name}</div>
        <div class="stocks">
          ${sec.stocks.map(s=>`<span class="chip">${s.name}${s.leader ? " ★" : ""}</span>`).join("")}
        </div>
        <div class="meta">추정 섹터 시총: ${sec.marketCap}조원 기준 정렬</div>
        <div class="ai">AI 요약: ${sec.ai}</div>
      </article>
    `;
  }).join("");
}

function toggleDark(){
  document.body.classList.toggle("dark");
  localStorage.setItem("dark", document.body.classList.contains("dark"));
}

if(localStorage.getItem("dark")==="true") document.body.classList.add("dark");

document.getElementById("search").addEventListener("input", render);
document.getElementById("sort").addEventListener("change", render);
render();
</script>
</body>
</html>
