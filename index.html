<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>한국 증시 섹터맵</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f6fb;
      color: #111827;
    }

    h1 {
      margin: 0;
      font-size: 42px;
      font-weight: 900;
      color: #111827;
    }

    .subtitle {
      margin-top: 8px;
      font-size: 20px;
      color: #6b7280;
      font-weight: 700;
    }

    .top-bar {
      display: grid;
      grid-template-columns: 1fr 170px;
      gap: 14px;
      margin: 28px 0;
    }

    input, select {
      width: 100%;
      border: 1px solid #e5e7eb;
      outline: none;
      background: white;
      border-radius: 22px;
      padding: 20px;
      font-size: 20px;
      font-weight: 700;
      box-shadow: 0 4px 14px rgba(0,0,0,0.04);
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 28px;
    }

    .summary-card {
      background: white;
      border-radius: 24px;
      padding: 22px 10px;
      text-align: center;
      border: 1px solid #e5e7eb;
      box-shadow: 0 8px 24px rgba(0,0,0,0.04);
    }

    .summary-label {
      font-size: 18px;
      font-weight: 800;
      color: #111827;
    }

    .summary-number {
      margin-top: 10px;
      font-size: 46px;
      color: #2563eb;
      font-weight: 900;
    }

    .sector-card {
      background: white;
      border-radius: 30px;
      padding: 22px;
      margin-bottom: 26px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }

    .rank-box {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 22px;
      padding: 18px;
      font-size: 22px;
      font-weight: 900;
      color: #2563eb;
      margin-bottom: 18px;
    }

    .sector-title {
      border: 1px solid #e5e7eb;
      border-radius: 22px;
      padding: 22px;
      font-size: 36px;
      font-weight: 900;
      margin-bottom: 18px;
      background: white;
    }

    .sector-desc {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 22px;
      padding: 20px;
      font-size: 19px;
      line-height: 1.55;
      font-weight: 800;
      color: #6b7280;
      margin-bottom: 18px;
    }

    .leader-box {
      background: #eef4ff;
      border: 1px solid #dbeafe;
      border-radius: 22px;
      padding: 20px;
      font-size: 22px;
      font-weight: 900;
      margin-bottom: 18px;
    }

    .chip-box {
      border: 1px solid #e5e7eb;
      border-radius: 22px;
      padding: 18px;
      margin-bottom: 18px;
    }

    .stock-chip {
      display: inline-block;
      background: #eef2ff;
      border-radius: 999px;
      padding: 12px 18px;
      margin: 6px;
      font-size: 18px;
      font-weight: 900;
      color: #111827;
    }

    .market-cap {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 22px;
      padding: 18px;
      font-size: 21px;
      font-weight: 900;
      color: #6b7280;
      margin-bottom: 18px;
    }

    .ai-box {
      background: #eef4ff;
      border-left: 8px solid #2563eb;
      border-radius: 22px;
      padding: 20px;
      font-size: 19px;
      line-height: 1.6;
      font-weight: 800;
    }
    @media (max-width: 768px) {

  body{
    padding:16px;
  }

  h1{
    font-size:32px;
  }

  .subtitle{
    font-size:15px;
  }

  .top-bar{
    grid-template-columns:1fr 110px;
  }

  input,
  select{
    font-size:16px;
    padding:16px;
  }

  .summary-grid{
    gap:10px;
  }

  .summary-card{
    padding:18px 8px;
  }

  .summary-label{
    font-size:15px;
  }

  .summary-number{
    font-size:34px;
  }

  .sector-card{
    padding:16px;
    border-radius:22px;
  }

  .rank-box{
    font-size:16px;
    padding:14px;
  }

  .sector-title{
    font-size:24px;
    padding:18px;
  }

  .sector-desc{
    font-size:14px;
    padding:16px;
  }

  .leader-box{
    font-size:16px;
    padding:16px;
  }

  .stock-chip{
    font-size:13px;
    padding:10px 14px;
  }

  .market-cap{
    font-size:15px;
    padding:16px;
  }

  .ai-box{
    font-size:14px;
    padding:16px;
    line-height:1.5;
  }
}
  </style>
</head>

<body>
  <h1>한국 증시 섹터맵</h1>
  <div class="subtitle">섹터별 대장주 · 소부장 · 시총순 자동 정리</div>

  <div class="top-bar">
    <input type="text" id="searchInput" placeholder="종목명 또는 섹터 검색" />
    <select id="sortSelect">
      <option value="score">섹터점수</option>
      <option value="cap">시총순</option>
    </select>
  </div>

  <div class="summary-grid">
    <div class="summary-card">
      <div class="summary-label">섹터</div>
      <div class="summary-number" id="sectorCount">8</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">종목</div>
      <div class="summary-number" id="stockCount">40</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">대장주</div>
      <div class="summary-number" id="leaderCount">8</div>
    </div>
  </div>

  <div id="sectorList"></div>

  <script>
    const sectors = [
      {
        name: "반도체",
        score: 98,
        cap: 870,
        desc: "AI, HBM, 메모리, 파운드리, 장비·소재 중심 핵심 섹터",
        leader: "삼성전자",
        stocks: ["삼성전자 ★", "SK하이닉스", "한미반도체", "리노공업", "솔브레인"],
        ai: "AI 요약: 현재 시장 주도 섹터입니다. HBM·AI 서버·고대역폭 메모리 중심으로 외국인 수급이 집중되고 있습니다."
      },
      {
        name: "조선",
        score: 94,
        cap: 210,
        desc: "LNG선, 특수선, 방산선박, 친환경 선박 중심 수주 산업",
        leader: "HD현대중공업",
        stocks: ["HD현대중공업 ★", "한화오션", "삼성중공업", "HD한국조선해양", "현대미포조선"],
        ai: "AI 요약: 장기 수주잔고와 LNG선 수요가 핵심입니다. 실적 가시성이 높은 대표 경기민감 섹터입니다."
      },
      {
        name: "방산",
        score: 92,
        cap: 190,
        desc: "K방산, 수출, 미사일, 항공우주, 지상무기 중심 섹터",
        leader: "한화에어로스페이스",
        stocks: ["한화에어로스페이스 ★", "LIG넥스원", "현대로템", "한국항공우주", "풍산"],
        ai: "AI 요약: 지정학적 리스크와 수출 계약 확대가 핵심입니다. 중장기 성장성이 강한 섹터입니다."
      },
      {
        name: "바이오",
        score: 88,
        cap: 230,
        desc: "신약, CDMO, 바이오시밀러, 항체치료제 중심 성장 섹터",
        leader: "삼성바이오로직스",
        stocks: ["삼성바이오로직스 ★", "셀트리온", "유한양행", "알테오젠", "리가켐바이오"],
        ai: "AI 요약: 금리 안정과 임상 성과에 민감합니다. 대형주는 안정성, 중소형주는 모멘텀 중심입니다."
      },
      {
        name: "2차전지",
        score: 82,
        cap: 260,
        desc: "배터리, 양극재, 음극재, 전해질, 리튬 밸류체인 섹터",
        leader: "LG에너지솔루션",
        stocks: ["LG에너지솔루션 ★", "삼성SDI", "포스코퓨처엠", "에코프로비엠", "엘앤에프"],
        ai: "AI 요약: 전기차 수요와 메탈 가격에 민감합니다. 반등 시 탄력은 크지만 변동성도 큽니다."
      },
      {
        name: "자동차",
        score: 80,
        cap: 310,
        desc: "완성차, 부품, 전장, 전기차, 하이브리드 중심 섹터",
        leader: "현대차",
        stocks: ["현대차 ★", "기아", "현대모비스", "HL만도", "성우하이텍"],
        ai: "AI 요약: 환율, 미국 판매량, 주주환원 정책이 핵심입니다. 실적 안정성이 높은 섹터입니다."
      },
      {
        name: "전력기기",
        score: 86,
        cap: 120,
        desc: "변압기, 전력망, 초고압 케이블, AI 데이터센터 전력 수요 섹터",
        leader: "HD현대일렉트릭",
        stocks: ["HD현대일렉트릭 ★", "LS ELECTRIC", "효성중공업", "일진전기", "대한전선"],
        ai: "AI 요약: AI 데이터센터와 전력망 투자가 핵심입니다. 글로벌 전력 인프라 사이클 수혜가 있습니다."
      },
      {
        name: "인터넷·AI",
        score: 78,
        cap: 180,
        desc: "플랫폼, 생성형 AI, 클라우드, 광고, 커머스 중심 섹터",
        leader: "NAVER",
        stocks: ["NAVER ★", "카카오", "더존비즈온", "솔트룩스", "폴라리스AI"],
        ai: "AI 요약: AI 서비스 상용화와 광고 경기 회복이 핵심입니다. 성장 기대감은 있으나 실적 확인이 중요합니다."
      }
    ];

    const sectorList = document.getElementById("sectorList");
    const searchInput = document.getElementById("searchInput");
    const sortSelect = document.getElementById("sortSelect");

    function renderSectors() {
      const keyword = searchInput.value.toLowerCase();
      const sortType = sortSelect.value;

      let filtered = sectors.filter(sector =>
        sector.name.toLowerCase().includes(keyword) ||
        sector.leader.toLowerCase().includes(keyword) ||
        sector.stocks.join(" ").toLowerCase().includes(keyword)
      );

      filtered.sort((a, b) => {
        if (sortType === "cap") return b.cap - a.cap;
        return b.score - a.score;
      });

      sectorList.innerHTML = filtered.map((sector, index) => `
        <div class="sector-card">
          <div class="rank-box">#${index + 1} · 섹터점수 ${sector.score}</div>
          <div class="sector-title">${sector.name}</div>
          <div class="sector-desc">${sector.desc}</div>
          <div class="leader-box">대장주 · ${sector.leader}</div>

          <div class="chip-box">
            ${sector.stocks.map(stock => `<span class="stock-chip">${stock}</span>`).join("")}
          </div>

          <div class="market-cap">추정 섹터 시총: ${sector.cap}조원</div>
          <div class="ai-box">${sector.ai}</div>
        </div>
      `).join("");
    }

    searchInput.addEventListener("input", renderSectors);
    sortSelect.addEventListener("change", renderSectors);

    renderSectors();
  </script>
</body>
</html>
