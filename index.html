<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>한국 증시 섹터맵</title>

  <style>
    *{box-sizing:border-box}

    body{
      margin:0;
      padding:18px;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:#f4f6fb;
      color:#111827;
    }

    h1{
      margin:0;
      font-size:30px;
      font-weight:900;
    }

    .subtitle{
      margin-top:6px;
      color:#6b7280;
      font-size:14px;
      font-weight:700;
    }

    .top-bar{
      display:grid;
      grid-template-columns:1fr 90px;
      gap:10px;
      margin:20px 0;
    }

    input,select,button{
      border:1px solid #e5e7eb;
      background:white;
      border-radius:16px;
      padding:13px;
      font-size:14px;
      font-weight:800;
      outline:none;
    }

    button{
      background:#2563eb;
      color:white;
      border:none;
      cursor:pointer;
    }

    .dark-btn{
      background:#111827;
    }

    .section-title{
      font-size:18px;
      font-weight:900;
      margin:20px 0 10px;
    }

    .sector-card{
      background:white;
      border:1px solid #e5e7eb;
      border-radius:22px;
      padding:18px;
      margin-bottom:14px;
      box-shadow:0 8px 24px rgba(0,0,0,.05);
    }

    .sector-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      cursor:pointer;
    }

    .sector-name{
      font-size:24px;
      font-weight:900;
    }

    .sector-score{
      color:#2563eb;
      font-weight:900;
      font-size:14px;
    }

    .sector-desc{
      margin-top:12px;
      background:#f8fafc;
      padding:13px;
      border-radius:14px;
      font-size:13px;
      line-height:1.5;
      color:#6b7280;
      font-weight:700;
    }

    .detail{
      display:none;
      margin-top:16px;
    }

    .detail.open{
      display:block;
    }

    .leader-box{
      background:#eef4ff;
      border-radius:16px;
      padding:14px;
      font-weight:900;
      margin-bottom:14px;
    }

    .parts-row{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-bottom:14px;
    }

    .part-btn{
      width:auto;
      background:#eef2ff;
      color:#111827;
      padding:10px 14px;
      border-radius:999px;
      font-size:13px;
    }

    .part-btn.active{
      background:#2563eb;
      color:white;
    }

    .stock-list{
      display:grid;
      gap:10px;
    }

    .stock-card{
      background:#f8fafc;
      border:1px solid #e5e7eb;
      border-radius:16px;
      padding:13px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
    }

    .stock-name{
      font-weight:900;
      font-size:15px;
    }

    .stock-type{
      color:#6b7280;
      font-size:12px;
      font-weight:800;
      margin-top:3px;
    }

    .delete-btn{
      width:auto;
      background:#ef4444;
      padding:9px 11px;
      font-size:12px;
    }

    .add-box{
      background:white;
      border:1px solid #e5e7eb;
      border-radius:22px;
      padding:16px;
      margin-top:18px;
      box-shadow:0 8px 24px rgba(0,0,0,.05);
    }

    .form-grid{
      display:grid;
      gap:9px;
    }

    .mini-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:9px;
    }

    .danger{
      background:#ef4444;
    }

    body.dark{
      background:#0f172a;
      color:#e5e7eb;
    }

    body.dark input,
    body.dark select,
    body.dark .sector-card,
    body.dark .add-box,
    body.dark .stock-card{
      background:#1e293b;
      color:#e5e7eb;
      border-color:#334155;
    }

    body.dark .sector-desc{
      background:#0f172a;
      color:#cbd5e1;
    }

    body.dark .leader-box{
      background:#172554;
    }

    body.dark .part-btn{
      background:#334155;
      color:#e5e7eb;
    }

    body.dark .part-btn.active{
      background:#2563eb;
    }
  </style>
</head>

<body>
  <h1>한국 증시 섹터맵</h1>
  <div class="subtitle">섹터 클릭 → 대장주 · 소부장 · 종목 관리</div>

  <div class="top-bar">
    <input id="searchInput" placeholder="섹터 또는 종목 검색" />
    <button class="dark-btn" onclick="toggleDark()">다크</button>
  </div>

  <div class="section-title">섹터 목록</div>
  <div id="sectorList"></div>

  <div class="section-title">섹터 추가</div>
  <div class="add-box">
    <div class="form-grid">
      <input id="newSectorName" placeholder="섹터명 예: 로봇" />
      <input id="newSectorDesc" placeholder="섹터 설명 예: 산업용 로봇, 감속기, 자동화" />
      <input id="newSectorScore" type="number" placeholder="섹터점수 예: 85" />
      <button onclick="addSector()">섹터 추가</button>
    </div>
  </div>

  <div class="section-title">종목 추가</div>
  <div class="add-box">
    <div class="form-grid">
      <select id="stockSectorSelect"></select>
      <input id="newStockName" placeholder="종목명 예: 삼성전자" />
      <select id="newStockType">
        <option value="대장주">대장주</option>
        <option value="장비">장비</option>
        <option value="소재">소재</option>
        <option value="부품">부품</option>
        <option value="플랫폼">플랫폼</option>
        <option value="완성품">완성품</option>
        <option value="기타">기타</option>
      </select>
      <input id="newStockCap" type="number" placeholder="시총점수 예: 100" />
      <button onclick="addStock()">종목 추가</button>
    </div>
  </div>

  <script>
    const defaultData = [
      {
        name:"반도체",
        score:98,
        desc:"AI, HBM, 메모리, 파운드리, 장비·소재 중심 핵심 섹터",
        stocks:[
          {name:"삼성전자", type:"대장주", cap:470},
          {name:"SK하이닉스", type:"대장주", cap:150},
          {name:"한미반도체", type:"장비", cap:12},
          {name:"리노공업", type:"부품", cap:4},
          {name:"솔브레인", type:"소재", cap:2}
        ]
      },
      {
        name:"조선",
        score:94,
        desc:"LNG선, 특수선, 친환경 선박 중심 수주 산업",
        stocks:[
          {name:"HD현대중공업", type:"대장주", cap:16},
          {name:"한화오션", type:"완성품", cap:12},
          {name:"삼성중공업", type:"완성품", cap:10},
          {name:"HD한국조선해양", type:"대장주", cap:14},
          {name:"현대미포조선", type:"완성품", cap:4}
        ]
      },
      {
        name:"방산",
        score:92,
        desc:"K방산, 수출, 미사일, 항공우주, 지상무기 중심 섹터",
        stocks:[
          {name:"한화에어로스페이스", type:"대장주", cap:20},
          {name:"LIG넥스원", type:"부품", cap:5},
          {name:"현대로템", type:"완성품", cap:6},
          {name:"한국항공우주", type:"완성품", cap:5},
          {name:"풍산", type:"소재", cap:2}
        ]
      },
      {
        name:"바이오",
        score:88,
        desc:"신약, CDMO, 바이오시밀러, 항체치료제 중심 성장 섹터",
        stocks:[
          {name:"삼성바이오로직스", type:"대장주", cap:70},
          {name:"셀트리온", type:"대장주", cap:40},
          {name:"유한양행", type:"신약", cap:8},
          {name:"알테오젠", type:"플랫폼", cap:15},
          {name:"리가켐바이오", type:"플랫폼", cap:4}
        ]
      }
    ];

    let sectors = JSON.parse(localStorage.getItem("sectorData")) || defaultData;
    let openedSector = null;
    let selectedPart = "전체";

    const sectorList = document.getElementById("sectorList");
    const searchInput = document.getElementById("searchInput");
    const stockSectorSelect = document.getElementById("stockSectorSelect");

    function saveData(){
      localStorage.setItem("sectorData", JSON.stringify(sectors));
    }

    function getLeader(sector){
      if(!sector.stocks.length) return null;
      const leaders = sector.stocks.filter(s => s.type === "대장주");
      const pool = leaders.length ? leaders : sector.stocks;
      return [...pool].sort((a,b)=>(b.cap||0)-(a.cap||0))[0];
    }

    function renderSectorOptions(){
      stockSectorSelect.innerHTML = sectors.map((s,i)=>
        `<option value="${i}">${s.name}</option>`
      ).join("");
    }

    function renderSectors(){
      const keyword = searchInput.value.toLowerCase();

      const filtered = sectors
        .map((sector,index)=>({...sector, originalIndex:index}))
        .filter(sector =>
          sector.name.toLowerCase().includes(keyword) ||
          sector.stocks.some(stock => stock.name.toLowerCase().includes(keyword))
        )
        .sort((a,b)=>b.score-a.score);

      sectorList.innerHTML = filtered.map(sector=>{
        const leader = getLeader(sector);
        const isOpen = openedSector === sector.originalIndex;

        const parts = ["전체", ...new Set(sector.stocks.map(s=>s.type))];

        const visibleStocks = selectedPart === "전체"
          ? sector.stocks
          : sector.stocks.filter(s => s.type === selectedPart);

        return `
          <div class="sector-card">
            <div class="sector-head" onclick="toggleSector(${sector.originalIndex})">
              <div>
                <div class="sector-name">${sector.name}</div>
                <div class="sector-score">섹터점수 ${sector.score}</div>
              </div>
              <div style="font-weight:900;">${isOpen ? "접기" : "열기"}</div>
            </div>

            <div class="sector-desc">${sector.desc}</div>

            <div class="detail ${isOpen ? "open" : ""}">
              <div class="leader-box">
                대장주 · ${leader ? leader.name : "없음"}
              </div>

              <div class="parts-row">
                ${parts.map(part=>`
                  <button class="part-btn ${selectedPart===part ? "active" : ""}"
                    onclick="event.stopPropagation(); selectPart('${part}')">
                    ${part}
                  </button>
                `).join("")}
              </div>

              <div class="stock-list">
                ${visibleStocks.map((stock,stockIndex)=>{
                  const realIndex = sector.stocks.findIndex(s => s.name === stock.name && s.type === stock.type);
                  return `
                    <div class="stock-card">
                      <div>
                        <div class="stock-name">${stock.name}</div>
                        <div class="stock-type">${stock.type} · 시총점수 ${stock.cap || 0}</div>
                      </div>
                      <button class="delete-btn" onclick="event.stopPropagation(); deleteStock(${sector.originalIndex},${realIndex})">
                        삭제
                      </button>
                    </div>
                  `;
                }).join("")}
              </div>

              <button class="danger" style="margin-top:14px;" onclick="event.stopPropagation(); deleteSector(${sector.originalIndex})">
                이 섹터 삭제
              </button>
            </div>
          </div>
        `;
      }).join("");

      renderSectorOptions();
    }

    function toggleSector(index){
      openedSector = openedSector === index ? null : index;
      selectedPart = "전체";
      renderSectors();
    }

    function selectPart(part){
      selectedPart = part;
      renderSectors();
    }

    function addSector(){
      const name = document.getElementById("newSectorName").value.trim();
      const desc = document.getElementById("newSectorDesc").value.trim();
      const score = Number(document.getElementById("newSectorScore").value || 70);

      if(!name){
        alert("섹터명을 입력하세요.");
        return;
      }

      sectors.push({
        name,
        desc: desc || "설명을 입력하세요.",
        score,
        stocks:[]
      });

      saveData();

      document.getElementById("newSectorName").value = "";
      document.getElementById("newSectorDesc").value = "";
      document.getElementById("newSectorScore").value = "";

      renderSectors();
    }

    function deleteSector(index){
      if(!confirm("이 섹터를 삭제할까요?")) return;

      sectors.splice(index,1);
      openedSector = null;
      saveData();
      renderSectors();
    }

    function addStock(){
      const sectorIndex = Number(stockSectorSelect.value);
      const name = document.getElementById("newStockName").value.trim();
      const type = document.getElementById("newStockType").value;
      const cap = Number(document.getElementById("newStockCap").value || 1);

      if(!name){
        alert("종목명을 입력하세요.");
        return;
      }

      sectors[sectorIndex].stocks.push({name,type,cap});

      saveData();

      openedSector = sectorIndex;
      selectedPart = "전체";

      document.getElementById("newStockName").value = "";
      document.getElementById("newStockCap").value = "";

      renderSectors();
    }

    function deleteStock(sectorIndex,stockIndex){
      if(!confirm("이 종목을 삭제할까요?")) return;

      sectors[sectorIndex].stocks.splice(stockIndex,1);
      saveData();
      renderSectors();
    }

    function toggleDark(){
      document.body.classList.toggle("dark");
      localStorage.setItem("darkMode", document.body.classList.contains("dark"));
    }

    if(localStorage.getItem("darkMode") === "true"){
      document.body.classList.add("dark");
    }

    searchInput.addEventListener("input", renderSectors);

    renderSectors();
  </script>
</body>
</html>
