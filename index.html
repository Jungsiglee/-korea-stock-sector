<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>한국 증시 섹터맵 Pro</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=JetBrains+Mono:wght@700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f2f8;--card:#ffffff;--border:#e2e6f0;--text:#0d1117;--sub:#6b7280;
  --blue:#1d4ed8;--blue-light:#dbeafe;--green:#15803d;--green-light:#dcfce7;
  --red:#b91c1c;--red-light:#fee2e2;--yellow:#92400e;--yellow-light:#fef3c7;
  --purple:#6d28d9;--purple-light:#ede9fe;
  --shadow:0 2px 16px rgba(0,0,0,.07);--shadow-lg:0 8px 32px rgba(0,0,0,.1);--radius:18px;
}
body.dark{
  --bg:#0b0f1a;--card:#141928;--border:#1e2740;--text:#e8ecf4;--sub:#8b95a8;
  --blue-light:#1e3a5f;--green-light:#14301f;--red-light:#3b1515;
  --yellow-light:#3b2e0a;--purple-light:#2e1f5e;
}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);padding:16px 16px 100px;transition:background .2s,color .2s;}

.header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;gap:12px;}
.header h1{font-size:26px;font-weight:900;letter-spacing:-1px;}
.tagline{font-size:12px;color:var(--sub);font-weight:700;margin-top:4px;}
.dark-btn{background:var(--card);border:1px solid var(--border);color:var(--text);padding:10px 16px;border-radius:12px;font-size:12px;font-weight:900;cursor:pointer;}

.search-wrap{position:relative;margin-bottom:12px;}
.search-wrap input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 14px 14px 42px;font-size:14px;font-weight:700;color:var(--text);outline:none;font-family:inherit;}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none;}

.fixed-bar{position:sticky;top:0;z-index:40;background:var(--bg);padding:8px 0 12px;}
.action-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.action-row.three{grid-template-columns:1fr 1fr 1fr;}
.btn{padding:12px;border:none;border-radius:14px;font-size:13px;font-weight:900;cursor:pointer;font-family:inherit;color:white;}
.btn-blue{background:#1d4ed8}.btn-green{background:#16a34a}.btn-purple{background:#7c3aed}
.btn-orange{background:#ea580c}.btn-red{background:#dc2626}.btn-gray{background:#6b7280}

.dart-key-panel{background:var(--purple-light);border:1px solid #c4b5fd;border-radius:16px;padding:14px;margin-bottom:14px;}
.dart-key-title{font-size:13px;font-weight:900;color:var(--purple);margin-bottom:8px;}
.dart-key-row{display:flex;gap:8px;}
.dart-key-row input{flex:1;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:700;color:var(--text);outline:none;font-family:'JetBrains Mono',monospace;}
.dart-key-row button{background:var(--purple);color:white;border:none;border-radius:10px;padding:10px 14px;font-size:12px;font-weight:900;cursor:pointer;font-family:inherit;white-space:nowrap;}
.dart-key-guide{font-size:11px;color:var(--sub);font-weight:700;margin-top:6px;line-height:1.6;}
.dart-key-guide a{color:var(--purple);text-decoration:none;font-weight:900;}

.panel{display:none;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow);}
.panel.open{display:block}
.panel-title{font-size:16px;font-weight:900;margin-bottom:12px;}
.form-grid{display:grid;gap:9px;}
.form-input,.form-select,.form-textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px;font-size:13px;font-weight:700;color:var(--text);outline:none;font-family:inherit;}
.form-textarea{min-height:64px;resize:vertical;line-height:1.6;}
.form-label{font-size:11px;font-weight:900;color:var(--sub);margin-bottom:3px;}

.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 10px;text-align:center;}
.stat-num{font-size:20px;font-weight:900;font-family:'JetBrains Mono',monospace;}
.stat-label{font-size:10px;color:var(--sub);font-weight:700;margin-top:2px;}

.section-title{font-size:13px;font-weight:900;color:var(--sub);text-transform:uppercase;letter-spacing:1px;margin:18px 0 10px;}

.sector-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);}
.sector-head{display:flex;justify-content:space-between;align-items:flex-start;cursor:pointer;gap:10px;}
.sector-name-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.sector-name{font-size:20px;font-weight:900;letter-spacing:-.5px;}
.score-badge{background:var(--blue);color:white;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:900;}
.sector-desc{font-size:12px;color:var(--sub);font-weight:700;margin-top:6px;line-height:1.5;}
.preview-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;}
.preview-chip{background:var(--blue-light);color:var(--blue);padding:3px 8px;border-radius:999px;font-size:11px;font-weight:900;}
.toggle-btn{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:10px;font-size:11px;font-weight:900;cursor:pointer;white-space:nowrap;flex-shrink:0;}

.detail{display:none;margin-top:16px;border-top:1px solid var(--border);padding-top:16px;}
.detail.open{display:block}
.leader-box{background:var(--blue-light);border-radius:12px;padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.leader-info .lbl{font-size:10px;color:var(--sub);font-weight:900;}
.leader-info .val{font-size:15px;font-weight:900;color:var(--blue);}
.filter-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.filter-btn{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:7px 12px;border-radius:999px;font-size:12px;font-weight:900;cursor:pointer;}
.filter-btn.active{background:var(--blue);color:white;border-color:var(--blue);}

.stock-list{display:grid;gap:10px;}
.stock-card{background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:12px;}
.stock-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px;}
.sname{font-size:15px;font-weight:900;}
.ssub{font-size:11px;color:var(--sub);font-weight:700;margin-top:2px;}
.badge-row{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap;}
.type-badge{padding:3px 8px;border-radius:999px;font-size:11px;font-weight:900;}
.type-대장주{background:#fbbf24;color:#78350f;}.type-장비{background:#a5f3fc;color:#164e63;}
.type-소재{background:#bbf7d0;color:#14532d;}.type-부품{background:#fde68a;color:#78350f;}
.type-완성품{background:#c4b5fd;color:#3b0764;}.type-플랫폼{background:#fbcfe8;color:#831843;}
.type-신약{background:#fed7aa;color:#7c2d12;}.type-AI{background:#e0e7ff;color:#3730a3;}
.type-기타{background:#f1f5f9;color:#475569;}
.status-badge{padding:3px 8px;border-radius:999px;font-size:11px;font-weight:900;}
.status-관심{background:var(--blue-light);color:var(--blue);}.status-매수대기{background:var(--yellow-light);color:var(--yellow);}
.status-보유{background:var(--green-light);color:var(--green);}.status-매도검토{background:var(--red-light);color:var(--red);}
.stock-btns{display:flex;gap:5px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;}
.icon-btn{border:none;border-radius:10px;font-size:11px;font-weight:900;cursor:pointer;padding:7px 10px;color:white;font-family:inherit;white-space:nowrap;}
.btn-chart{background:#0ea5e9}.btn-info{background:#8b5cf6}.btn-del{background:#ef4444}
.scontrols{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.scontrols select,.scontrols input{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px;font-size:12px;font-weight:700;color:var(--text);outline:none;font-family:inherit;width:100%;}
.memo-lbl{font-size:11px;font-weight:900;color:var(--blue);margin-bottom:4px;}
.memo-ta{width:100%;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px;font-size:12px;font-weight:700;color:var(--text);outline:none;font-family:inherit;min-height:52px;resize:vertical;line-height:1.5;}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:999;padding:16px;align-items:flex-end;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal-box{background:var(--card);border-radius:22px 22px 0 0;width:100%;max-width:540px;max-height:88vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 -8px 40px rgba(0,0,0,.25);}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--border);flex-shrink:0;}
.modal-title{font-size:16px;font-weight:900;}
.modal-close{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:7px 14px;border-radius:10px;font-size:12px;font-weight:900;cursor:pointer;}
.modal-body{padding:16px;overflow-y:auto;flex:1;}

.quick-links{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
.quick-btn{border:none;border-radius:14px;padding:14px 10px;font-size:12px;font-weight:900;cursor:pointer;color:white;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:5px;line-height:1.3;text-align:center;}
.quick-btn .icon{font-size:22px;}
.q-naver{background:linear-gradient(135deg,#03c75a,#028a3d);}
.q-naverstock{background:linear-gradient(135deg,#0ea5e9,#0369a1);}
.q-dart{background:linear-gradient(135deg,#8b5cf6,#5b21b6);}
.q-tv{background:linear-gradient(135deg,#1d4ed8,#1e3a8a);}

.dart-section-title{font-size:13px;font-weight:900;margin-bottom:10px;color:var(--text);}
.dart-loading{text-align:center;padding:24px;color:var(--sub);font-size:13px;font-weight:700;}
.dart-spinner{display:inline-block;width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--purple);border-radius:50%;animation:spin .7s linear infinite;margin-bottom:8px;}
@keyframes spin{to{transform:rotate(360deg)}}
.dart-list{display:grid;gap:8px;}
.dart-item{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px;cursor:pointer;transition:border-color .15s;}
.dart-item:hover{border-color:var(--purple);}
.dart-item-title{font-size:13px;font-weight:900;line-height:1.4;margin-bottom:5px;}
.dart-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.dart-date{font-size:11px;color:var(--sub);font-weight:700;}
.dart-type{font-size:11px;font-weight:900;padding:2px 7px;border-radius:999px;}
.t-정기{background:#dbeafe;color:#1d4ed8;}.t-주요{background:#fef3c7;color:#92400e;}
.t-지분{background:#dcfce7;color:#15803d;}.t-기타{background:#f1f5f9;color:#6b7280;}
.dart-empty{text-align:center;padding:20px;color:var(--sub);font-size:13px;font-weight:700;}
.dart-error{background:var(--red-light);border-radius:12px;padding:14px;font-size:13px;font-weight:700;color:var(--red);line-height:1.6;}
.dart-nokey{background:var(--purple-light);border-radius:12px;padding:14px;}
.dart-nokey p{font-size:13px;font-weight:700;color:var(--purple);line-height:1.7;}
.dart-nokey a{color:var(--purple);font-weight:900;}
.dart-nokey button{margin-top:10px;width:100%;background:var(--purple);color:white;border:none;border-radius:10px;padding:10px;font-size:13px;font-weight:900;cursor:pointer;font-family:inherit;}

.reset-wrap{margin-top:12px;text-align:center;}
.reset-btn{background:none;border:1px solid var(--border);color:var(--sub);padding:10px 20px;border-radius:12px;font-size:12px;font-weight:900;cursor:pointer;font-family:inherit;}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>🇰🇷 섹터맵 Pro</h1>
    <div class="tagline">대장주 · 소부장 · 뉴스 · DART 공시 앱 내 직접 조회</div>
  </div>
  <button class="dark-btn" onclick="toggleDark()">🌙 다크</button>
</div>

<!-- DART API 키 패널 -->
<div class="dart-key-panel">
  <div class="dart-key-title">📋 DART 전자공시 API 연동</div>
  <div class="dart-key-row">
    <input type="password" id="dartKeyInput" placeholder="DART OpenAPI 키 입력" />
    <button onclick="saveDartKey()">저장</button>
  </div>
  <div class="dart-key-guide">
    키 없으면 → <a href="https://opendart.fss.or.kr" target="_blank">opendart.fss.or.kr</a> 회원가입 후 오픈API 신청 (무료, 이메일 즉시 발급)<br>
    <span id="dartKeyStatus"></span>
  </div>
</div>

<div class="search-wrap">
  <span class="search-icon">🔍</span>
  <input id="searchInput" placeholder="섹터명, 종목명, 메모 검색..." />
</div>

<div class="fixed-bar">
  <div class="action-row">
    <button class="btn btn-blue" onclick="togglePanel('sectorPanel')">＋ 섹터 추가</button>
    <button class="btn btn-green" onclick="togglePanel('stockPanel')">＋ 종목 추가</button>
  </div>
  <div class="action-row three">
    <button class="btn btn-purple" onclick="backupData()">💾 백업</button>
    <button class="btn btn-orange" onclick="document.getElementById('restoreFile').click()">📂 복원</button>
    <button class="btn btn-gray" onclick="togglePanel('settingPanel')">⚙ 설정</button>
  </div>
</div>
<input id="restoreFile" type="file" accept=".json" style="display:none" onchange="restoreData(event)" />

<div id="sectorPanel" class="panel">
  <div class="panel-title">📁 섹터 추가</div>
  <div class="form-grid">
    <input id="newSectorName" class="form-input" placeholder="섹터명 예: 원전" />
    <input id="newSectorDesc" class="form-input" placeholder="설명" />
    <input id="newSectorScore" class="form-input" type="number" placeholder="섹터점수 1~100" />
    <button class="btn btn-blue" onclick="addSector()">저장</button>
  </div>
</div>

<div id="stockPanel" class="panel">
  <div class="panel-title">📈 종목 추가</div>
  <div class="form-grid">
    <div><div class="form-label">소속 섹터</div><select id="stockSectorSelect" class="form-select"></select></div>
    <div><div class="form-label">종목명 (코드 자동완성)</div><input id="newStockName" class="form-input" placeholder="예: 삼성전자" oninput="autoFillCode()" /></div>
    <div><div class="form-label">차트코드</div><input id="newStockCode" class="form-input" placeholder="예: KRX:005930" /></div>
    <div><div class="form-label">구분</div>
      <select id="newStockType" class="form-select">
        <option>대장주</option><option>장비</option><option>소재</option><option>부품</option>
        <option>완성품</option><option>플랫폼</option><option>신약</option><option>AI</option><option>기타</option>
      </select>
    </div>
    <div><div class="form-label">시총점수</div><input id="newStockCap" class="form-input" type="number" placeholder="예: 100" /></div>
    <div><div class="form-label">목표가</div><input id="newStockTarget" class="form-input" placeholder="예: 95,000원" /></div>
    <div><div class="form-label">매매 상태</div>
      <select id="newStockStatus" class="form-select">
        <option>관심</option><option>매수대기</option><option>보유</option><option>매도검토</option>
      </select>
    </div>
    <div><div class="form-label">메모</div><textarea id="newStockMemo" class="form-textarea" placeholder="투자 근거, 리스크, 모멘텀 등"></textarea></div>
    <button class="btn btn-green" onclick="addStock()">종목 저장</button>
  </div>
</div>

<div id="settingPanel" class="panel">
  <div class="panel-title">⚙ 설정</div>
  <div class="form-grid">
    <div class="form-label">정렬 기준</div>
    <select id="sortMode" class="form-select" onchange="renderSectors()">
      <option value="score">섹터점수 높은 순</option>
      <option value="name">이름순</option>
      <option value="stocks">종목수 많은 순</option>
    </select>
    <div style="height:4px;"></div>
    <button class="btn btn-red" onclick="resetData()">⚠ 초기 데이터로 복구</button>
  </div>
</div>

<div class="stats-bar" id="statsBar"></div>
<div class="section-title">섹터 목록</div>
<div id="sectorList"></div>
<div class="reset-wrap"><button class="reset-btn" onclick="resetData()">초기 데이터로 복구</button></div>

<!-- 모달 -->
<div class="modal-overlay" id="infoModal">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title" id="infoModalTitle"></div>
      <button class="modal-close" onclick="closeModal()">✕ 닫기</button>
    </div>
    <div class="modal-body" id="infoModalBody"></div>
  </div>
</div>

<script>

const PROXY = "https://api.allorigins.win/get?url=";

function saveDartKey(){
  const k = document.getElementById("dartKeyInput").value.trim();
  if(!k){ alert("API 키를 입력하세요."); return; }
  localStorage.setItem("dartApiKey", k);
  document.getElementById("dartKeyInput").value = "";
  updateDartKeyStatus();
  alert("DART API 키가 저장되었습니다 ✅\n이제 종목 뉴스·공시 버튼을 눌러보세요!");
}
function updateDartKeyStatus(){
  const k = localStorage.getItem("dartApiKey");
  const el = document.getElementById("dartKeyStatus");
  if(k) el.innerHTML = `✅ API 키 등록됨 (끝자리 ...${k.slice(-4)}) · <a href="#" onclick="if(confirm('키를 삭제할까요?')){localStorage.removeItem('dartApiKey');updateDartKeyStatus();}return false;" style="color:var(--purple)">삭제</a>`;
  else el.innerHTML = "⚠ 키 미등록 → 공시 조회 불가";
}

async function fetchDartDisclosures(name){
  const apiKey = localStorage.getItem("dartApiKey");
  if(!apiKey) return {status:"NO_KEY"};
  const today = new Date(), past = new Date();
  past.setMonth(past.getMonth()-6);
  const fmt = d => d.toISOString().slice(0,10).replace(/-/g,"");
  try{
    // Step 1: corp_code
    const url1 = `${DART}/company.json?crtfc_key=${apiKey}&corp_name=${encodeURIComponent(name)}`;
    const r1 = await fetch(PROXY + encodeURIComponent(url1));
    const co = JSON.parse((await r1.json()).contents);
    if(co.status !== "000" || !co.corp_code) return {status:"NOT_FOUND"};
    // Step 2: list
    const url2 = `${DART}/list.json?crtfc_key=${apiKey}&corp_code=${co.corp_code}&bgn_de=${fmt(past)}&end_de=${fmt(today)}&page_count=15&sort=date&sort_mth=desc`;
    const r2 = await fetch(PROXY + encodeURIComponent(url2));
    const res = JSON.parse((await r2.json()).contents);
    return {status:"OK", list: res.list||[]};
  }catch(e){ return {status:"ERROR", msg:e.message}; }
}

function dartTypeLabel(nm){
  if(!nm) return ["기타","t-기타"];
  if(nm.includes("사업보고서")||nm.includes("분기보고서")||nm.includes("반기보고서")) return ["정기공시","t-정기"];
  if(nm.includes("주요사항")||nm.includes("유상증자")||nm.includes("합병")||nm.includes("자기주식")) return ["주요사항","t-주요"];
  if(nm.includes("지분")||nm.includes("주식등")) return ["지분공시","t-지분"];
  return ["기타","t-기타"];
}

      ${code?`<button class="quick-btn q-tv" onclick="openChart('${name}','${code}')"><span class="icon">📈</span>차트 보기</button>`:""}
    </div>
    <div class="dart-section-title">📋 최근 6개월 공시 <span style="font-size:11px;color:var(--sub);font-weight:700;">(DART OpenAPI 앱 내 조회)</span></div>
    <div id="dartResult"><div class="dart-loading"><div class="dart-spinner"></div><br>공시 불러오는 중...</div></div>
  `;
  document.getElementById("infoModal").classList.add("open");

  const res = await fetchDartDisclosures(name);
  const el = document.getElementById("dartResult");
  if(!el) return;

  if(res.status==="NO_KEY"){
    el.innerHTML=`<div class="dart-nokey"><p>🔑 <strong>DART API 키</strong>가 필요해요.<br>
      <a href="https://opendart.fss.or.kr" target="_blank">opendart.fss.or.kr</a> 접속 → 회원가입 → 오픈API 신청 → 이메일로 키 수신 (무료)<br>
      발급 후 이 화면 위쪽 보라색 패널에 입력하면 돼요.</p>
      <button onclick="closeModal()">🔑 API 키 입력하러 가기</button></div>`;
    return;
  }
  if(res.status==="NOT_FOUND"){
    el.innerHTML=`<div class="dart-empty">📭 DART에서 "${name}" 검색 결과가 없어요.<br><small>회사명이 정확한지 확인해보세요.</small></div>`;return;
  }
  if(res.status==="ERROR"){
    el.innerHTML=`<div class="dart-error">⚠ 공시 조회 오류<br>${res.msg||""}<br><br>잠시 후 다시 시도하거나, 키가 올바른지 확인해주세요.</div>`;return;
  }
  if(!res.list||res.list.length===0){
    el.innerHTML=`<div class="dart-empty">📭 최근 6개월 내 공시가 없어요.</div>`;return;
  }

  el.innerHTML=`<div class="dart-list">${res.list.map(d=>{
    const [label,cls]=dartTypeLabel(d.report_nm);
    const dt=d.rcept_dt?d.rcept_dt.replace(/(\d{4})(\d{2})(\d{2})/,"$1.$2.$3"):"";
    const url=`https://dart.fss.or.kr/dsaf001/main.do?rcpNo=${d.rcept_no}`;
    return `<div class="dart-item" onclick="window.open('${url}','_blank')">
      <div class="dart-item-title">${d.report_nm||"제목 없음"}</div>
      <div class="dart-meta">
        <span class="dart-date">📅 ${dt}</span>
        <span class="dart-type ${cls}">${label}</span>
        ${d.flr_nm?`<span class="dart-date">· ${d.flr_nm}</span>`:""}
      </div>
    </div>`;
  }).join("")}</div>`;
}

function closeModal(){
  document.getElementById("infoModal").classList.remove("open");
}
document.getElementById("infoModal").addEventListener("click",function(e){if(e.target===this)closeModal();});

/* ── 헬퍼 ── */
function autoFillCode(){
  const n=document.getElementById("newStockName").value.trim();
  const e=document.getElementById("newStockCode");
  if(stockCodeMap[n]) e.value=stockCodeMap[n];
}
function togglePanel(id){document.getElementById(id).classList.toggle("open");if(id==="stockPanel")renderSectorOptions();}
function getLeader(s){if(!s.stocks.length)return null;const l=s.stocks.filter(x=>x.type==="대장주");const p=l.length?l:s.stocks;return [...p].sort((a,b)=>(b.cap||0)-(a.cap||0))[0];}
function saveData(){localStorage.setItem("sectorData_v2",JSON.stringify(sectors));}
function normalizeData(){sectors.forEach(s=>s.stocks.forEach(st=>{if(!st.memo)st.memo="";if(!st.target)st.target="";if(!st.status)st.status="관심";if(!st.code&&stockCodeMap[st.name])st.code=stockCodeMap[st.name];}));saveData();}

/* ── 렌더링 ── */
function renderStats(){
  const tot=sectors.reduce((a,s)=>a+s.stocks.length,0);
  const h=sectors.reduce((a,s)=>a+s.stocks.filter(st=>st.status==="보유").length,0);
  const w=sectors.reduce((a,s)=>a+s.stocks.filter(st=>st.status==="매수대기").length,0);
  document.getElementById("statsBar").innerHTML=`
    <div class="stat-card"><div class="stat-num">${sectors.length}</div><div class="stat-label">섹터</div></div>
    <div class="stat-card"><div class="stat-num">${tot}</div><div class="stat-label">총 종목</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--green)">${h}</div><div class="stat-label">보유</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--yellow)">${w}</div><div class="stat-label">매수대기</div></div>`;
}
function renderSectorOptions(){
  document.getElementById("stockSectorSelect").innerHTML=sectors.map((s,i)=>`<option value="${i}">${s.name}</option>`).join("");
}
function getSorted(arr){
  const m=document.getElementById("sortMode")?.value||"score";
  if(m==="name")return [...arr].sort((a,b)=>a.name.localeCompare(b.name,"ko"));
  if(m==="stocks")return [...arr].sort((a,b)=>b.stocks.length-a.stocks.length);
  return [...arr].sort((a,b)=>b.score-a.score);
}
function renderSectors(){
  renderStats();
  const kw=document.getElementById("searchInput").value.toLowerCase().trim();
  const filtered=sectors.map((s,i)=>({...s,oi:i})).filter(s=>!kw||s.name.toLowerCase().includes(kw)||s.desc.toLowerCase().includes(kw)||s.stocks.some(st=>st.name.toLowerCase().includes(kw)||(st.memo||"").toLowerCase().includes(kw)));
  document.getElementById("sectorList").innerHTML=getSorted(filtered).map(sector=>{
    const leader=getLeader(sector),isOpen=openedSector===sector.oi;
    const parts=["전체",...new Set(sector.stocks.map(s=>s.type))];
    const vis=selectedPart==="전체"?sector.stocks:sector.stocks.filter(s=>s.type===selectedPart);
    const hC=sector.stocks.filter(s=>s.status==="보유").length;
    const wC=sector.stocks.filter(s=>s.status==="매수대기").length;
    const chips=sector.stocks.filter(s=>s.type==="대장주").slice(0,3).map(s=>`<span class="preview-chip">${s.name}</span>`).join("");
    return `<div class="sector-card">
  <div class="sector-head" onclick="toggleSector(${sector.oi})">
    <div style="flex:1;min-width:0;">
      <div class="sector-name-row">
        <span class="sector-name">${sector.name}</span>
        <span class="score-badge">${sector.score}pt</span>
        ${hC?`<span class="status-badge status-보유" style="font-size:10px;padding:2px 7px;">보유 ${hC}</span>`:""}
        ${wC?`<span class="status-badge status-매수대기" style="font-size:10px;padding:2px 7px;">대기 ${wC}</span>`:""}
      </div>
      <div class="sector-desc">${sector.desc}</div>
      ${chips?`<div class="preview-chips">${chips}</div>`:""}
    </div>
    <button class="toggle-btn" onclick="event.stopPropagation();toggleSector(${sector.oi})">${isOpen?"▲ 접기":"▼ 열기"}</button>
  </div>
  <div class="detail ${isOpen?"open":""}">
    <div class="leader-box"><span style="font-size:18px;">👑</span>
      <div class="leader-info"><div class="lbl">대장주</div><div class="val">${leader?leader.name:"미지정"}</div></div>
    </div>
    <div class="filter-row">
      ${parts.map(p=>`<button class="filter-btn ${selectedPart===p?"active":""}" onclick="event.stopPropagation();selectPart('${p}')">${p}</button>`).join("")}
    </div>
    <div class="stock-list">
      ${vis.map(stock=>{
        const ri=sector.stocks.findIndex(s=>s.name===stock.name&&s.type===stock.type);
        return `<div class="stock-card">
  <div class="stock-top">
    <div>
      <div class="sname">${stock.name}</div>
      <div class="ssub">시총점수 ${stock.cap||0}${stock.target?" · "+stock.target:""}</div>
      <div class="badge-row"><span class="type-badge type-${stock.type}">${stock.type}</span><span class="status-badge status-${stock.status}">${stock.status}</span></div>
    </div>
    <div class="stock-btns">
      <button class="icon-btn btn-chart" onclick="event.stopPropagation();openChart('${stock.name}','${stock.code||""}')">차트</button>
      <button class="icon-btn btn-info" onclick="event.stopPropagation();openInfo('${stock.name}','${stock.code||""}')">뉴스·공시</button>
      <button class="icon-btn btn-del" onclick="event.stopPropagation();deleteStock(${sector.oi},${ri})">삭제</button>
    </div>
  </div>
  <div class="scontrols">
    <select onclick="event.stopPropagation()" onchange="updateStatus(${sector.oi},${ri},this.value)">
      <option value="관심" ${stock.status==="관심"?"selected":""}>👀 관심</option>
      <option value="매수대기" ${stock.status==="매수대기"?"selected":""}>⏳ 매수대기</option>
      <option value="보유" ${stock.status==="보유"?"selected":""}>✅ 보유</option>
      <option value="매도검토" ${stock.status==="매도검토"?"selected":""}>🔴 매도검토</option>
    </select>
    <input onclick="event.stopPropagation()" value="${stock.target||""}" oninput="updateTarget(${sector.oi},${ri},this.value)" placeholder="목표가" />
  </div>
  <div><div class="memo-lbl">📝 메모</div>
    <textarea class="memo-ta" onclick="event.stopPropagation()" oninput="updateMemo(${sector.oi},${ri},this.value)" placeholder="투자 근거, 리스크, 모멘텀...">${stock.memo||""}</textarea>
  </div>
</div>`;}).join("")}
    </div>
    <button class="btn btn-red" style="width:100%;font-size:12px;padding:10px;margin-top:12px;" onclick="event.stopPropagation();deleteSector(${sector.oi})">이 섹터 삭제</button>
  </div>
</div>`;
  }).join("");
  renderSectorOptions();
}

function toggleSector(i){openedSector=openedSector===i?null:i;selectedPart="전체";renderSectors();}
function selectPart(p){selectedPart=p;renderSectors();}
function updateMemo(si,sti,v){sectors[si].stocks[sti].memo=v;saveData();}
function updateTarget(si,sti,v){sectors[si].stocks[sti].target=v;saveData();}
function updateStatus(si,sti,v){sectors[si].stocks[sti].status=v;saveData();renderSectors();}

function addSector(){
  const n=document.getElementById("newSectorName").value.trim();
  if(!n){alert("섹터명을 입력하세요.");return;}
  sectors.push({name:n,desc:document.getElementById("newSectorDesc").value.trim()||"설명 없음",score:Number(document.getElementById("newSectorScore").value||70),stocks:[]});
  saveData();["newSectorName","newSectorDesc","newSectorScore"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("sectorPanel").classList.remove("open");renderSectors();
}
function addStock(){
  const si=Number(document.getElementById("stockSectorSelect").value);
  const n=document.getElementById("newStockName").value.trim();
  if(!n){alert("종목명을 입력하세요.");return;}
  let c=document.getElementById("newStockCode").value.trim();if(!c)c=stockCodeMap[n]||"";
  sectors[si].stocks.push({name:n,code:c,type:document.getElementById("newStockType").value,cap:Number(document.getElementById("newStockCap").value||1),target:document.getElementById("newStockTarget").value.trim(),status:document.getElementById("newStockStatus").value,memo:document.getElementById("newStockMemo").value.trim()});
  saveData();openedSector=si;selectedPart="전체";
  ["newStockName","newStockCode","newStockCap","newStockTarget","newStockMemo"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("stockPanel").classList.remove("open");renderSectors();
}
function deleteSector(i){if(!confirm("섹터를 삭제할까요?"))return;sectors.splice(i,1);openedSector=null;saveData();renderSectors();}
function deleteStock(si,sti){if(!confirm("종목을 삭제할까요?"))return;sectors[si].stocks.splice(sti,1);saveData();renderSectors();}
function openChart(name,code){const c=code||stockCodeMap[name]||"";if(!c){alert("차트코드가 없습니다.");return;}window.open("https://kr.tradingview.com/chart/?symbol="+encodeURIComponent(c),"_blank");}
function backupData(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({app:"sector-map-pro",savedAt:new Date().toISOString(),sectors},null,2)],{type:"application/json"}));a.download=`sector-map-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href);}
function restoreData(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{try{const d=JSON.parse(e.target.result);const data=d.sectors||d;if(!Array.isArray(data)){alert("형식 오류");return;}if(!confirm("교체할까요?"))return;sectors=data;normalizeData();openedSector=null;selectedPart="전체";saveData();renderSectors();alert("복원 완료 ✅");}catch(e){alert("JSON 오류");}};r.readAsText(f);}
function resetData(){if(!confirm("초기 데이터로 복구할까요?"))return;localStorage.removeItem("sectorData_v2");sectors=JSON.parse(JSON.stringify(defaultData));openedSector=null;selectedPart="전체";saveData();renderSectors();}
function toggleDark(){document.body.classList.toggle("dark");localStorage.setItem("darkMode",document.body.classList.contains("dark"));}
if(localStorage.getItem("darkMode")==="true")document.body.classList.add("dark");
document.getElementById("searchInput").addEventListener("input",renderSectors);

updateDartKeyStatus();
normalizeData();
renderSectors();
</script>
</body>
</html>
