<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>한국 증시 섹터맵 Pro</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=JetBrains+Mono:wght@700&display=swap');

*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#f0f2f8;
  --card:#ffffff;
  --border:#e2e6f0;
  --text:#0d1117;
  --sub:#6b7280;
  --blue:#1d4ed8;
  --blue-light:#dbeafe;
  --green:#15803d;
  --green-light:#dcfce7;
  --red:#b91c1c;
  --red-light:#fee2e2;
  --orange:#c2410c;
  --orange-light:#ffedd5;
  --purple:#6d28d9;
  --purple-light:#ede9fe;
  --yellow:#92400e;
  --yellow-light:#fef3c7;
  --teal:#0f766e;
  --teal-light:#ccfbf1;
  --shadow:0 2px 16px rgba(0,0,0,.07);
  --shadow-lg:0 8px 32px rgba(0,0,0,.1);
  --radius:18px;
}

body.dark{
  --bg:#0b0f1a;
  --card:#141928;
  --border:#1e2740;
  --text:#e8ecf4;
  --sub:#8b95a8;
  --blue-light:#1e3a5f;
  --green-light:#14301f;
  --red-light:#3b1515;
  --orange-light:#3b1f0a;
  --purple-light:#2e1f5e;
  --yellow-light:#3b2e0a;
  --teal-light:#0a2e2b;
}

body{
  font-family:'Noto Sans KR',sans-serif;
  background:var(--bg);
  color:var(--text);
  padding:16px 16px 100px;
  min-height:100vh;
  transition:background .2s,color .2s;
}

/* ─── Header ─── */
.header{
  display:flex;justify-content:space-between;align-items:flex-start;
  margin-bottom:18px;gap:12px;
}
.header-left h1{
  font-size:26px;font-weight:900;letter-spacing:-1px;line-height:1.1;
}
.header-left .tagline{
  font-size:12px;color:var(--sub);font-weight:700;margin-top:4px;
}
.dark-btn{
  background:var(--card);border:1px solid var(--border);color:var(--text);
  padding:10px 16px;border-radius:12px;font-size:12px;font-weight:900;
  cursor:pointer;white-space:nowrap;
}

/* ─── Search ─── */
.search-wrap{position:relative;margin-bottom:12px;}
.search-wrap input{
  width:100%;background:var(--card);border:1px solid var(--border);
  border-radius:14px;padding:14px 14px 14px 42px;
  font-size:14px;font-weight:700;color:var(--text);outline:none;
  font-family:inherit;
}
.search-icon{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  font-size:16px;pointer-events:none;
}

/* ─── Action Bars ─── */
.fixed-bar{
  position:sticky;top:0;z-index:40;background:var(--bg);
  padding:8px 0 12px;
}
.action-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.action-row.three{grid-template-columns:1fr 1fr 1fr;}
.btn{
  padding:12px;border:none;border-radius:14px;font-size:13px;font-weight:900;
  cursor:pointer;font-family:inherit;color:white;transition:opacity .15s;
}
.btn:active{opacity:.8}
.btn-blue{background:var(--blue);}
.btn-green{background:#16a34a;}
.btn-purple{background:#7c3aed;}
.btn-orange{background:#ea580c;}
.btn-red{background:#dc2626;}
.btn-gray{background:var(--sub);}

/* ─── Panels ─── */
.panel{
  display:none;background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px;margin-bottom:14px;
  box-shadow:var(--shadow);
}
.panel.open{display:block}
.panel-title{font-size:16px;font-weight:900;margin-bottom:12px;}
.form-grid{display:grid;gap:9px;}
.form-input,.form-select,.form-textarea{
  width:100%;background:var(--bg);border:1px solid var(--border);
  border-radius:12px;padding:12px;font-size:13px;font-weight:700;
  color:var(--text);outline:none;font-family:inherit;
}
.form-textarea{min-height:64px;resize:vertical;line-height:1.6;}
.form-label{font-size:11px;font-weight:900;color:var(--sub);margin-bottom:3px;}

/* ─── Stats Bar ─── */
.stats-bar{
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px;
}
.stat-card{
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:12px 10px;text-align:center;
}
.stat-num{font-size:20px;font-weight:900;font-family:'JetBrains Mono',monospace;}
.stat-label{font-size:10px;color:var(--sub);font-weight:700;margin-top:2px;}

/* ─── Sector Cards ─── */
.section-title{
  font-size:13px;font-weight:900;color:var(--sub);
  text-transform:uppercase;letter-spacing:1px;margin:18px 0 10px;
}

.sector-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px;margin-bottom:12px;
  box-shadow:var(--shadow);transition:box-shadow .2s;
}
.sector-card:hover{box-shadow:var(--shadow-lg);}

.sector-head{
  display:flex;justify-content:space-between;align-items:flex-start;
  cursor:pointer;gap:10px;
}
.sector-meta{flex:1;}
.sector-name-row{display:flex;align-items:center;gap:8px;}
.sector-name{font-size:20px;font-weight:900;letter-spacing:-.5px;}
.sector-score-badge{
  background:var(--blue);color:white;padding:3px 9px;border-radius:999px;
  font-size:11px;font-weight:900;font-family:'JetBrains Mono',monospace;
}
.sector-desc{
  font-size:12px;color:var(--sub);font-weight:700;margin-top:6px;line-height:1.5;
}
.sector-stocks-preview{
  display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;
}
.preview-chip{
  background:var(--blue-light);color:var(--blue);
  padding:3px 8px;border-radius:999px;font-size:11px;font-weight:900;
}
.body.dark .preview-chip{color:#93c5fd;}

.toggle-btn{
  background:var(--bg);border:1px solid var(--border);color:var(--text);
  padding:8px 12px;border-radius:10px;font-size:11px;font-weight:900;
  cursor:pointer;white-space:nowrap;flex-shrink:0;
}

/* ─── Sector Detail ─── */
.detail{display:none;margin-top:16px;border-top:1px solid var(--border);padding-top:16px;}
.detail.open{display:block}

.leader-box{
  background:var(--blue-light);border-radius:12px;padding:12px 14px;
  margin-bottom:12px;display:flex;align-items:center;gap:8px;
}
.leader-crown{font-size:18px;}
.leader-info .label{font-size:10px;color:var(--sub);font-weight:900;}
.leader-info .value{font-size:15px;font-weight:900;color:var(--blue);}

.filter-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.filter-btn{
  background:var(--bg);border:1px solid var(--border);color:var(--text);
  padding:7px 12px;border-radius:999px;font-size:12px;font-weight:900;
  cursor:pointer;
}
.filter-btn.active{background:var(--blue);color:white;border-color:var(--blue);}

/* ─── Stock Cards ─── */
.stock-list{display:grid;gap:10px;}
.stock-card{
  background:var(--bg);border:1px solid var(--border);border-radius:14px;
  padding:12px;
}
.stock-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px;}
.stock-info .stock-name{font-size:15px;font-weight:900;}
.stock-info .stock-sub{font-size:11px;color:var(--sub);font-weight:700;margin-top:2px;}

.badge-row{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap;}
.type-badge{
  padding:3px 8px;border-radius:999px;font-size:11px;font-weight:900;
}
.type-대장주{background:#fbbf24;color:#78350f;}
.type-장비{background:#a5f3fc;color:#164e63;}
.type-소재{background:#bbf7d0;color:#14532d;}
.type-부품{background:#fde68a;color:#78350f;}
.type-완성품{background:#c4b5fd;color:#3b0764;}
.type-플랫폼{background:#fbcfe8;color:#831843;}
.type-신약{background:#fed7aa;color:#7c2d12;}
.type-AI{background:#e0e7ff;color:#3730a3;}
.type-기타{background:#f1f5f9;color:#475569;}

.status-badge{
  padding:3px 8px;border-radius:999px;font-size:11px;font-weight:900;
}
.status-관심{background:var(--blue-light);color:var(--blue);}
.status-매수대기{background:var(--yellow-light);color:var(--yellow);}
.status-보유{background:var(--green-light);color:var(--green);}
.status-매도검토{background:var(--red-light);color:var(--red);}

/* ─── Stock Buttons ─── */
.stock-btns{display:flex;gap:5px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;}
.icon-btn{
  border:none;border-radius:10px;font-size:11px;font-weight:900;
  cursor:pointer;padding:7px 10px;color:white;font-family:inherit;
  white-space:nowrap;
}
.btn-chart{background:#0ea5e9;}
.btn-news{background:#f97316;}
.btn-dart{background:#8b5cf6;}
.btn-del{background:#ef4444;}

/* ─── Stock Controls ─── */
.stock-controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.stock-controls select,.stock-controls input{
  background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:9px;font-size:12px;font-weight:700;
  color:var(--text);outline:none;font-family:inherit;width:100%;
}
.memo-wrap{margin-top:6px;}
.memo-label{font-size:11px;font-weight:900;color:var(--blue);margin-bottom:4px;}
.stock-controls textarea{
  width:100%;background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:9px;font-size:12px;font-weight:700;
  color:var(--text);outline:none;font-family:inherit;
  min-height:56px;resize:vertical;line-height:1.5;
}

/* ─── News Modal ─── */
.modal-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);
  z-index:999;padding:16px;align-items:center;justify-content:center;
}
.modal-overlay.open{display:flex;}
.modal-box{
  background:var(--card);border-radius:var(--radius);
  width:100%;max-width:480px;max-height:80vh;overflow:hidden;
  display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3);
}
.modal-header{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 16px;border-bottom:1px solid var(--border);
}
.modal-title{font-size:15px;font-weight:900;}
.modal-close{
  background:var(--bg);border:1px solid var(--border);color:var(--text);
  padding:7px 12px;border-radius:10px;font-size:12px;font-weight:900;cursor:pointer;
}
.modal-body{padding:14px;overflow-y:auto;flex:1;}
.news-link-row{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;
}
.news-link-btn{
  border:none;border-radius:12px;padding:14px;font-size:13px;font-weight:900;
  cursor:pointer;color:white;font-family:inherit;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:4px;
}
.news-link-btn .icon{font-size:24px;}
.news-link-btn .label{font-size:12px;}
.news-link-btn.naver{background:linear-gradient(135deg,#03c75a,#2db400);}
.news-link-btn.dart{background:linear-gradient(135deg,#6d28d9,#4c1d95);}
.news-link-btn.kinda{background:linear-gradient(135deg,#0ea5e9,#0284c7);}
.news-link-btn.tradingview{background:linear-gradient(135deg,#1d4ed8,#1e3a8a);}

.info-section{background:var(--bg);border-radius:12px;padding:12px;}
.info-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);}
.info-row:last-child{border:none;}
.info-key{font-size:12px;font-weight:900;color:var(--sub);}
.info-val{font-size:12px;font-weight:900;}

/* ─── Reset ─── */
.reset-wrap{margin-top:12px;text-align:center;}
.reset-btn{
  background:none;border:1px solid var(--border);color:var(--sub);
  padding:10px 20px;border-radius:12px;font-size:12px;font-weight:900;
  cursor:pointer;font-family:inherit;
}

/* ─── Utility ─── */
.gap{height:12px;}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>🇰🇷 섹터맵 Pro</h1>
    <div class="tagline">대장주 · 소부장 · 뉴스 · DART 공시 연동</div>
  </div>
  <button class="dark-btn" onclick="toggleDark()">🌙 다크</button>
</div>

<div class="search-wrap">
  <span class="search-icon">🔍</span>
  <input id="searchInput" class="form-input" placeholder="섹터명, 종목명, 메모 검색..." />
</div>

<div class="fixed-bar">
  <div class="action-row">
    <button class="btn btn-blue" onclick="togglePanel('sectorPanel')">＋ 섹터 추가</button>
    <button class="btn btn-green" onclick="togglePanel('stockPanel')">＋ 종목 추가</button>
  </div>
  <div class="action-row three">
    <button class="btn btn-purple" onclick="backupData()">💾 백업</button>
    <button class="btn btn-orange" onclick="document.getElementById('restoreFile').click()">📂 복원</button>
    <button class="btn btn-gray" onclick="togglePanel('settingPanel')">⚙ 설정</button>
  </div>
</div>
<input id="restoreFile" type="file" accept=".json" style="display:none" onchange="restoreData(event)" />

<!-- 섹터 추가 패널 -->
<div id="sectorPanel" class="panel">
  <div class="panel-title">📁 섹터 추가</div>
  <div class="form-grid">
    <input id="newSectorName" class="form-input" placeholder="섹터명 예: 원전" />
    <input id="newSectorDesc" class="form-input" placeholder="설명 예: 원자력 발전, 소형모듈로, 주기기 공급" />
    <input id="newSectorScore" class="form-input" type="number" placeholder="섹터점수 1~100 예: 89" />
    <button class="btn btn-blue" onclick="addSector()">저장</button>
  </div>
</div>

<!-- 종목 추가 패널 -->
<div id="stockPanel" class="panel">
  <div class="panel-title">📈 종목 추가</div>
  <div class="form-grid">
    <div>
      <div class="form-label">소속 섹터</div>
      <select id="stockSectorSelect" class="form-select"></select>
    </div>
    <div>
      <div class="form-label">종목명 (입력 시 코드 자동완성)</div>
      <input id="newStockName" class="form-input" placeholder="예: 삼성전자" oninput="autoFillCode()" />
    </div>
    <div>
      <div class="form-label">차트코드 (TradingView)</div>
      <input id="newStockCode" class="form-input" placeholder="예: KRX:005930" />
    </div>
    <div>
      <div class="form-label">종목 구분</div>
      <select id="newStockType" class="form-select">
        <option value="대장주">대장주</option>
        <option value="장비">장비</option>
        <option value="소재">소재</option>
        <option value="부품">부품</option>
        <option value="완성품">완성품</option>
        <option value="플랫폼">플랫폼</option>
        <option value="신약">신약</option>
        <option value="AI">AI</option>
        <option value="기타">기타</option>
      </select>
    </div>
    <div>
      <div class="form-label">시총점수 (상대적 가중치)</div>
      <input id="newStockCap" class="form-input" type="number" placeholder="예: 100" />
    </div>
    <div>
      <div class="form-label">목표가</div>
      <input id="newStockTarget" class="form-input" placeholder="예: 95,000원" />
    </div>
    <div>
      <div class="form-label">매매 상태</div>
      <select id="newStockStatus" class="form-select">
        <option value="관심">관심</option>
        <option value="매수대기">매수대기</option>
        <option value="보유">보유</option>
        <option value="매도검토">매도검토</option>
      </select>
    </div>
    <div>
      <div class="form-label">메모</div>
      <textarea id="newStockMemo" class="form-textarea" placeholder="종목 특징, 투자 근거 등"></textarea>
    </div>
    <button class="btn btn-green" onclick="addStock()">종목 저장</button>
  </div>
</div>

<!-- 설정 패널 -->
<div id="settingPanel" class="panel">
  <div class="panel-title">⚙ 설정</div>
  <div class="form-grid">
    <div class="form-label">정렬 기준</div>
    <select id="sortMode" class="form-select" onchange="renderSectors()">
      <option value="score">섹터점수 높은 순</option>
      <option value="name">이름순</option>
      <option value="stocks">종목수 많은 순</option>
    </select>
    <div style="height:4px;"></div>
    <button class="btn btn-red" onclick="resetData()">⚠ 초기 데이터로 복구</button>
  </div>
</div>

<!-- 통계 바 -->
<div class="stats-bar" id="statsBar"></div>

<!-- 섹터 목록 -->
<div class="section-title">섹터 목록</div>
<div id="sectorList"></div>

<div class="reset-wrap">
  <button class="reset-btn" onclick="resetData()">초기 데이터로 복구</button>
</div>

<!-- 종목 정보/뉴스 모달 -->
<div class="modal-overlay" id="infoModal">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title" id="infoModalTitle">종목 정보</div>
      <button class="modal-close" onclick="closeModal()">닫기</button>
    </div>
    <div class="modal-body" id="infoModalBody"></div>
  </div>
</div>

<script>

/* ═══════════════════════════════════
   상태 관리
═══════════════════════════════════ */
let sectors = JSON.parse(localStorage.getItem("sectorData_v2")) || JSON.parse(JSON.stringify(defaultData));
let openedSector = null;
let selectedPart = "전체";

const $sectorList = document.getElementById("sectorList");
const $searchInput = document.getElementById("searchInput");
const $stockSectorSelect = document.getElementById("stockSectorSelect");

/* ─── 저장 ─── */
function saveData(){
  localStorage.setItem("sectorData_v2", JSON.stringify(sectors));
}

/* ─── 정규화 ─── */
function normalizeData(){
  sectors.forEach(sector=>{
    sector.stocks.forEach(stock=>{
      if(!stock.memo) stock.memo="";
      if(!stock.target) stock.target="";
      if(!stock.status) stock.status="관심";
      if(!stock.code && stockCodeMap[stock.name]){
        stock.code = stockCodeMap[stock.name];
      }
    });
  });
  saveData();
}

/* ─── 코드 추출 ─── */
function getNaverCode(code){
  if(!code) return null;
  return code.split(":")[1] || code;
}

/* ─── 자동완성 ─── */
function autoFillCode(){
  const name = document.getElementById("newStockName").value.trim();
  const codeEl = document.getElementById("newStockCode");
  if(stockCodeMap[name]) codeEl.value = stockCodeMap[name];
}

/* ─── 패널 토글 ─── */
function togglePanel(id){
  document.getElementById(id).classList.toggle("open");
  if(id === "stockPanel") renderSectorOptions();
}

/* ─── 대장주 찾기 ─── */
function getLeader(sector){
  if(!sector.stocks.length) return null;
  const leaders = sector.stocks.filter(s=>s.type==="대장주");
  const pool = leaders.length ? leaders : sector.stocks;
  return [...pool].sort((a,b)=>(b.cap||0)-(a.cap||0))[0];
}

/* ─── 통계 바 ─── */
function renderStats(){
  const totalSectors = sectors.length;
  const totalStocks = sectors.reduce((a,s)=>a+s.stocks.length, 0);
  const holding = sectors.reduce((a,s)=>a+s.stocks.filter(st=>st.status==="보유").length, 0);
  const watching = sectors.reduce((a,s)=>a+s.stocks.filter(st=>st.status==="매수대기").length, 0);
  document.getElementById("statsBar").innerHTML = `
    <div class="stat-card">
      <div class="stat-num">${totalSectors}</div>
      <div class="stat-label">섹터</div>
    </div>
    <div class="stat-card">
      <div class="stat-num">${totalStocks}</div>
      <div class="stat-label">총 종목</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" style="color:var(--green)">${holding}</div>
      <div class="stat-label">보유</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" style="color:var(--yellow)">${watching}</div>
      <div class="stat-label">매수대기</div>
    </div>
  `;
}

/* ─── 섹터 옵션 ─── */
function renderSectorOptions(){
  $stockSectorSelect.innerHTML = sectors.map((s,i)=>`<option value="${i}">${s.name}</option>`).join("");
}

/* ─── 정렬 ─── */
function getSortedSectors(filtered){
  const mode = document.getElementById("sortMode")?.value || "score";
  if(mode === "score") return [...filtered].sort((a,b)=>b.score-a.score);
  if(mode === "name") return [...filtered].sort((a,b)=>a.name.localeCompare(b.name,"ko"));
  if(mode === "stocks") return [...filtered].sort((a,b)=>b.stocks.length-a.stocks.length);
  return filtered;
}

/* ─── 섹터 렌더링 ─── */
function renderSectors(){
  renderStats();
  const keyword = $searchInput.value.toLowerCase().trim();
  const filtered = sectors
    .map((s,i)=>({...s, originalIndex:i}))
    .filter(s=>
      !keyword ||
      s.name.toLowerCase().includes(keyword) ||
      s.desc.toLowerCase().includes(keyword) ||
      s.stocks.some(st=>
        st.name.toLowerCase().includes(keyword) ||
        (st.memo||"").toLowerCase().includes(keyword)
      )
    );
  const sorted = getSortedSectors(filtered);

  $sectorList.innerHTML = sorted.map(sector=>{
    const leader = getLeader(sector);
    const isOpen = openedSector === sector.originalIndex;
    const parts = ["전체", ...new Set(sector.stocks.map(s=>s.type))];
    const visibleStocks = selectedPart === "전체"
      ? sector.stocks
      : sector.stocks.filter(s=>s.type===selectedPart);

    // 보유/매수대기 강조
    const holdCount = sector.stocks.filter(s=>s.status==="보유").length;
    const waitCount = sector.stocks.filter(s=>s.status==="매수대기").length;

    const previewStocks = sector.stocks
      .filter(s=>s.type==="대장주")
      .slice(0,3)
      .map(s=>`<span class="preview-chip">${s.name}</span>`).join("");

    return `
<div class="sector-card">
  <div class="sector-head" onclick="toggleSector(${sector.originalIndex})">
    <div class="sector-meta">
      <div class="sector-name-row">
        <span class="sector-name">${sector.name}</span>
        <span class="sector-score-badge">${sector.score}pt</span>
        ${holdCount ? `<span class="status-badge status-보유" style="font-size:10px;padding:2px 7px;">보유 ${holdCount}</span>` : ""}
        ${waitCount ? `<span class="status-badge status-매수대기" style="font-size:10px;padding:2px 7px;">대기 ${waitCount}</span>` : ""}
      </div>
      <div class="sector-desc">${sector.desc}</div>
      ${previewStocks ? `<div class="sector-stocks-preview">${previewStocks}</div>` : ""}
    </div>
    <button class="toggle-btn" onclick="event.stopPropagation();toggleSector(${sector.originalIndex})">${isOpen?"접기 ▲":"열기 ▼"}</button>
  </div>

  <div class="detail ${isOpen?"open":""}">
    <div class="leader-box">
      <span class="leader-crown">👑</span>
      <div class="leader-info">
        <div class="label">대장주</div>
        <div class="value">${leader ? leader.name : "미지정"}</div>
      </div>
    </div>

    <div class="filter-row">
      ${parts.map(p=>`
        <button class="filter-btn ${selectedPart===p?"active":""}"
          onclick="event.stopPropagation();selectPart('${p}')">
          ${p}
        </button>
      `).join("")}
    </div>

    <div class="stock-list">
      ${visibleStocks.map(stock=>{
        const realIdx = sector.stocks.findIndex(s=>s.name===stock.name&&s.type===stock.type);
        const naverCode = getNaverCode(stock.code);
        return `
<div class="stock-card">
  <div class="stock-top">
    <div class="stock-info">
      <div class="stock-name">${stock.name}</div>
      <div class="stock-sub">시총점수 ${stock.cap||0}${stock.target ? " · 목표가 "+stock.target : ""}</div>
      <div class="badge-row">
        <span class="type-badge type-${stock.type}">${stock.type}</span>
        <span class="status-badge status-${stock.status}">${stock.status}</span>
      </div>
    </div>
    <div class="stock-btns">
      <button class="icon-btn btn-chart" onclick="event.stopPropagation();openChart('${stock.name}','${stock.code||""}')">차트</button>
      <button class="icon-btn btn-news" onclick="event.stopPropagation();openInfo('${stock.name}','${stock.code||""}')">뉴스</button>
      <button class="icon-btn btn-dart" onclick="event.stopPropagation();openDart('${stock.name}')">공시</button>
      <button class="icon-btn btn-del" onclick="event.stopPropagation();deleteStock(${sector.originalIndex},${realIdx})">삭제</button>
    </div>
  </div>

  <div class="stock-controls">
    <select onclick="event.stopPropagation()" onchange="updateStatus(${sector.originalIndex},${realIdx},this.value)">
      <option value="관심" ${stock.status==="관심"?"selected":""}>👀 관심</option>
      <option value="매수대기" ${stock.status==="매수대기"?"selected":""}>⏳ 매수대기</option>
      <option value="보유" ${stock.status==="보유"?"selected":""}>✅ 보유</option>
      <option value="매도검토" ${stock.status==="매도검토"?"selected":""}>🔴 매도검토</option>
    </select>
    <input onclick="event.stopPropagation()"
      value="${stock.target||""}"
      oninput="updateTarget(${sector.originalIndex},${realIdx},this.value)"
      placeholder="목표가 입력" />
  </div>

  <div class="memo-wrap">
    <div class="memo-label">📝 메모</div>
    <textarea onclick="event.stopPropagation()"
      oninput="updateMemo(${sector.originalIndex},${realIdx},this.value)"
      placeholder="투자 근거, 리스크, 모멘텀 등...">${stock.memo||""}</textarea>
  </div>
</div>`;
      }).join("")}
    </div>

    <div style="margin-top:12px;">
      <button class="btn btn-red" style="width:100%;font-size:12px;padding:10px;"
        onclick="event.stopPropagation();deleteSector(${sector.originalIndex})">
        이 섹터 삭제
      </button>
    </div>
  </div>
</div>`;
  }).join("");

  renderSectorOptions();
}

/* ─── 토글 ─── */
function toggleSector(index){
  openedSector = openedSector===index ? null : index;
  selectedPart = "전체";
  renderSectors();
}
function selectPart(part){
  selectedPart = part;
  renderSectors();
}

/* ─── 업데이트 ─── */
function updateMemo(si,sti,v){ sectors[si].stocks[sti].memo=v; saveData(); }
function updateTarget(si,sti,v){ sectors[si].stocks[sti].target=v; saveData(); }
function updateStatus(si,sti,v){ sectors[si].stocks[sti].status=v; saveData(); renderSectors(); }

/* ─── 추가 ─── */
function addSector(){
  const name = document.getElementById("newSectorName").value.trim();
  const desc = document.getElementById("newSectorDesc").value.trim();
  const score = Number(document.getElementById("newSectorScore").value||70);
  if(!name){ alert("섹터명을 입력하세요."); return; }
  sectors.push({name, desc:desc||"설명 없음", score, stocks:[]});
  saveData();
  ["newSectorName","newSectorDesc","newSectorScore"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("sectorPanel").classList.remove("open");
  renderSectors();
}

function addStock(){
  const si = Number($stockSectorSelect.value);
  const name = document.getElementById("newStockName").value.trim();
  let code = document.getElementById("newStockCode").value.trim();
  if(!code) code = stockCodeMap[name]||"";
  const type = document.getElementById("newStockType").value;
  const cap = Number(document.getElementById("newStockCap").value||1);
  const target = document.getElementById("newStockTarget").value.trim();
  const status = document.getElementById("newStockStatus").value;
  const memo = document.getElementById("newStockMemo").value.trim();
  if(!name){ alert("종목명을 입력하세요."); return; }
  sectors[si].stocks.push({name,code,type,cap,target,status,memo});
  saveData();
  openedSector = si; selectedPart = "전체";
  ["newStockName","newStockCode","newStockCap","newStockTarget","newStockMemo"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("stockPanel").classList.remove("open");
  renderSectors();
}

/* ─── 삭제 ─── */
function deleteSector(index){
  if(!confirm("이 섹터를 삭제할까요?")) return;
  sectors.splice(index,1); openedSector=null; saveData(); renderSectors();
}
function deleteStock(si,sti){
  if(!confirm("이 종목을 삭제할까요?")) return;
  sectors[si].stocks.splice(sti,1); saveData(); renderSectors();
}

/* ─── 차트 ─── */
function openChart(name, code){

  window.open("https://kr.tradingview.com/chart/?symbol="+encodeURIComponent(c), "_blank");

/* ─── 백업/복원 ─── */
function backupData(){
  const blob = new Blob([JSON.stringify({app:"sector-map-pro",savedAt:new Date().toISOString(),sectors},null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `sector-map-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}
function restoreData(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const imported = JSON.parse(e.target.result);
      const data = imported.sectors || imported;
      if(!Array.isArray(data)){ alert("형식 오류"); return; }
      if(!confirm("현재 데이터를 백업 파일로 교체할까요?")) return;
      sectors = data;
      normalizeData();
      openedSector = null; selectedPart = "전체";
      saveData(); renderSectors();
      alert("복원 완료 ✅");
    }catch(e){ alert("JSON 파일을 읽을 수 없습니다."); }
  };
  reader.readAsText(file);
}
function resetData(){
  if(!confirm("모든 데이터를 초기화하고 기본 데이터로 복구할까요?")) return;
  localStorage.removeItem("sectorData_v2");
  sectors = JSON.parse(JSON.stringify(defaultData));
  openedSector = null; selectedPart = "전체";
  saveData(); renderSectors();
}

/* ─── 다크모드 ─── */
function toggleDark(){
  document.body.classList.toggle("dark");
  localStorage.setItem("darkMode", document.body.classList.contains("dark"));
}
if(localStorage.getItem("darkMode")==="true") document.body.classList.add("dark");

/* ─── 검색 ─── */
$searchInput.addEventListener("input", renderSectors);

/* ─── 초기화 ─── */
normalizeData();
renderSectors();
